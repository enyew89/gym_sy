services:
  - type: web
    name: gympro-management-system
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Abebe Kebede
      - key: ADMIN_EMAIL
        value: admin@gympro.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        value: "+251911223344"
      - key: CHAPA_PUBLIC_KEY
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
